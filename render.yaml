services:
  - type: web
    name: nada-ai-media-os
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Keep the service dormant after creation; deployments require an explicit manual action.
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    disk:
      name: nada-ai-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: REQUIRE_DATABASE_URL
        value: "false"
      - key: AI_MEDIA_DB_PATH
        value: /var/data/dashboard.sqlite3
      - key: OWNER_PASSWORD_FILE
        value: /var/data/owner-password.txt
      - key: OWNER_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
